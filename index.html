<!doctype html>
<html lang="pt" translate="no" class="notranslate theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="Sistema SaaS multi-tenant para gestão educacional, composto por uma camada Super Admin e uma camada de Tenant isolada." />
    <meta property="og:title" content="Sistema de Gerenciamento Educacional Multi-Contas" />
    <meta property="og:description" content="Sistema SaaS multi-tenant para gestão educacional, composto por uma camada Super Admin e uma camada de Tenant isolada." />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sistema de Gerenciamento Educacional Multi-Contas</title>
    <link rel="icon" type="image/png" href="/Logo2.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      /* Inicialização do tema síncrona para evitar flash de cor */
      try {
        var cookieMatch = document.cookie.match(/user_theme=([^;]+)/);
        var savedTheme = localStorage.getItem('user_theme') || (cookieMatch ? cookieMatch[1].trim() : null) || 'theme-dark';
        var isDark = savedTheme === 'theme-dark' || savedTheme === 'dark';
        document.documentElement.className = 'notranslate ' + (isDark ? 'theme-dark dark' : 'theme-slate light');
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registrado com sucesso:', reg.scope))
            .catch((err) => console.warn('Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
